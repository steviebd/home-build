

services:  
  # Sensor service - exposes metrics for Prometheus scraping
  sensor:
    build: ./sensor/sensor
    restart: unless-stopped
    # Access to the Raspberry Pi system. I2C for sensor communication, GPIO for shutdown buttons
    privileged: true
    ports:
      - "8000:8000"  # Metrics endpoint
    labels:
      io.balena.features.dbus: '1'
      io.balena.features.supervisor-api: '1'

  # Prometheus - local monitoring and forwarding to Grafana Cloud
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./sensor/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
