volumes:
  prometheus_data:

services:
  sensor:
    build: ./sensor/sensor
    privileged: true
    ports:
      - "8000:8000"
    environment:
      - DEVICE_DB_LOCATION=${DEVICE_DB_LOCATION}
      - PROMETHEUS_JOB_NAME=${PROMETHEUS_JOB_NAME}
    restart: unless-stopped

  prometheus:
    build: ./prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
    environment:
      - GRAFANA_CLOUD_PUSH_URL=${GRAFANA_CLOUD_PUSH_URL}
      - GRAFANA_CLOUD_USERNAME=${GRAFANA_CLOUD_USERNAME}
      - GRAFANA_CLOUD_PASSWORD=${GRAFANA_CLOUD_PASSWORD}
      - DEVICE_DB_LOCATION=${DEVICE_DB_LOCATION}
    depends_on:
      - sensor
    restart: unless-stopped
