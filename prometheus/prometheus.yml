global:
  scrape_interval: 60s
  external_labels:
    origin_prometheus: 'home-monitoring'

# Note: In Balena Cloud, environment variable substitution in config files
# doesn't work the same way. We'll handle remote_write through runtime config
# or use a startup script if needed.

scrape_configs:
  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Scrape sensor metrics
  - job_name: 'home-sensors'
    scrape_interval: 30s
    static_configs:
      - targets: ['sensor:8000']
    metrics_path: '/metrics'
